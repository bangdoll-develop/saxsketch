# CI。Linux でしか回さない —— Windows は Smart App Control が OCCT の DLL を
# 止めるので、そこで緑にしても何も保証できない（README「どの OS で動くか」）。
#
# **この設定は最初の push まで一度も走っていない。** 最初の数回は赤を見ながら
# 直すつもりでいること（特に OCP が要るシステムライブラリ）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 速い網。壊れていたら 1 分で分かるものだけ。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff==0.14.0
      - name: ruff（lint のみ。整形はしない）
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: tsc（型）とビルド
        run: npm run build
        working-directory: frontend

  # 公開の衛生。`saxsketch` を import しないので OCCT が要らず、数秒で終わる。
  # **ここが赤いときは他人の著作物か個人のパスが混ざっている。**
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/test_repo_hygiene.py -q

  # 本体。OCCT のビルドが入るので 15 分前後かかる。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: OCP が要る共有ライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxrender1 libxi6 libsm6 libice6 libspatialindex-dev
      - name: Python 依存（音響の extra 込み）
        # OpenWind は GPL-3 で**同梱しない**が、入れないと 8 本が skip になる
        # （インピーダンスの記録値が 2 エンジンで違った事故の網がそこにある）。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,acoustics]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: フロントを建てる
        # **建てないと 2 本が静かに skip する** —— 古いページが黙って動き続ける
        # 事故を捕まえる網がそこにある（`frontend/dist` の有無で分岐するため）。
        run: npm ci && npm run build
        working-directory: frontend
      - run: pytest -q
