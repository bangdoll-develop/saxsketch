[project]
name = "saxsketch"
version = "0.1.0"
description = "管楽器設計・3Dプリント統合開発環境 (Wind instrument design IDE for 3D printing)"
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "trimesh>=4.4",
    "networkx>=3.0",   # trimesh の 3MF ローダ（外部モデル採寸）に必須
    "lxml>=5.0",       # 同上（3MF は XML コンテナ）
    "rtree>=1.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Tier3 音響（OpenWind）。導入不可な環境では自作TMMへ自動フォールバックするため任意。
acoustics = ["openwind>=0.9"]
# 録音の検品（cad/inspection/analyze_recording.py）。ffmpeg 同梱で AAC を開ける。
# 関数の中で import しているので、無くても他の検品スクリプトは動く。
inspection = ["av>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saxsketch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
